<!doctype html><html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Đăng ký — EduAssist</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px;
 font-family:"Inter",system-ui,"Segoe UI",Roboto,Arial,sans-serif;color:#0f172a;
 background:#0a1f1c;background-image:radial-gradient(900px 500px at 15% 10%,#0d9488 0%,transparent 55%),
  radial-gradient(800px 520px at 85% 90%,#059669 0%,transparent 55%)}
.box{background:#fff;padding:34px;border-radius:20px;width:100%;max-width:430px;box-shadow:0 30px 70px -20px rgba(0,0,0,.5)}
.lg{display:flex;align-items:center;gap:11px;font-weight:800;font-size:19px;margin-bottom:20px}
.lg .mk{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:20px;color:#fff;
 background:linear-gradient(135deg,#0d9488,#059669)}
h1{font-size:21px;margin:0 0 5px;font-weight:750}.s{color:#64748b;font-size:13.5px;margin:0 0 22px}
label{display:block;font-size:12.5px;font-weight:650;color:#475569;margin:0 0 6px}
input{width:100%;padding:11px 13px;margin-bottom:14px;border:1px solid #d8e6e1;border-radius:11px;font:inherit;outline:none;transition:.15s}
input:focus{border-color:#0d9488;box-shadow:0 0 0 3px rgba(13,148,136,.13)}
.r{display:flex;gap:12px}.r>div{flex:1}
button{width:100%;padding:13px;background:linear-gradient(135deg,#059669,#10b981);color:#fff;border:0;border-radius:11px;
 font:inherit;font-weight:650;font-size:15px;cursor:pointer;box-shadow:0 10px 24px -12px #10b981}
button:hover{filter:brightness(1.07)}
.err{background:#fff1f2;color:#9f1239;padding:11px 14px;border-radius:11px;margin-bottom:14px;font-size:13.5px;border:1px solid #fecdd3}
.or{display:flex;align-items:center;gap:12px;margin:16px 0;color:#94a3b8;font-size:12.5px}
.or::before,.or::after{content:"";flex:1;height:1px;background:#e4eeea}
.gbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:12px;border:1px solid #d8e6e1;
 border-radius:11px;font-weight:600;font-size:14.5px;color:#334155;background:#fff;text-decoration:none}
.gbtn:hover{background:#f7fdfb;border-color:#0d9488}
.hint{margin-top:18px;text-align:center;font-size:13px}.hint a{color:#0d9488;font-weight:650;text-decoration:none}
</style></head><body>
<form class="box" method="post">
 <div class="lg"><span class="mk">🎓</span>EduAssist</div>
 <h1>Tạo tài khoản giáo viên</h1><p class="s">Chỉ mất 30 giây để bắt đầu sử dụng hệ thống.</p>
 {% with ms=get_flashed_messages() %}{% for m in ms %}<div class="err">{{m}}</div>{% endfor %}{% endwith %}
 <label>Họ và tên</label><input name="fullname" placeholder="Nguyễn Văn A" required>
 <label>Trường</label><input name="school" placeholder="Trường Tiểu học ...">
 <div class="r">
  <div><label>Môn dạy</label><input name="subject" placeholder="Toán"></div>
  <div><label>Tài khoản</label><input name="username" placeholder="gvtoan01" required></div>
 </div>
 <label>Mật khẩu</label><input name="password" type="password" placeholder="••••••••" required>
 <button>Đăng ký tài khoản</button>
 {% if google_enabled %}
 <div class="or"><span>hoặc</span></div>
 <a class="gbtn" href="{{url_for('auth.google_login')}}">
  <svg width="19" height="19" viewBox="0 0 48 48"><path fill="#4285F4" d="M45.1 24.5c0-1.6-.1-3.2-.4-4.7H24v9h11.8c-.5 2.7-2 5-4.4 6.6v5.5h7.1c4.2-3.8 6.6-9.5 6.6-16.4z"/><path fill="#34A853" d="M24 46c6 0 11-2 14.6-5.4l-7.1-5.5c-2 1.3-4.5 2.1-7.5 2.1-5.8 0-10.7-3.9-12.4-9.1H4.3v5.7C7.9 41 15.4 46 24 46z"/><path fill="#FBBC05" d="M11.6 28.1c-.4-1.3-.7-2.7-.7-4.1s.3-2.8.7-4.1v-5.7H4.3C2.8 17.1 2 20.4 2 24s.8 6.9 2.3 9.8l7.3-5.7z"/><path fill="#EA4335" d="M24 10.8c3.3 0 6.2 1.1 8.5 3.3l6.3-6.3C35 4.3 30 2 24 2 15.4 2 7.9 7 4.3 14.2l7.3 5.7c1.7-5.2 6.6-9.1 12.4-9.1z"/></svg>
  Đăng ký nhanh bằng Google</a>
 {% endif %}
 <div class="hint"><a href="{{url_for('auth.login')}}">← Quay lại đăng nhập</a></div>
</form></body></html>
